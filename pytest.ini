# pytest.ini
# ------------------------------------------------------------
# CONFIGURAÇÃO DO PYTEST
#
# O que desenvolver aqui:
#   Este arquivo configura como o pytest se comporta ao rodar os testes.
#   Não precisa de muito — as opções abaixo já cobrem bem o projeto.
#
# Como rodar os testes:
#   pytest                          → roda todos os testes
#   pytest tests/test_models.py     → roda só um arquivo
#   pytest -v                       → modo verboso (mostra nome de cada teste)
#   pytest --cov=contract_generator → mostra cobertura de código
# ------------------------------------------------------------

[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v
