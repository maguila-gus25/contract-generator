{% extends "base.html" %}
{% block title %}Cadastro — Contract Generator{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-person-plus text-primary" style="font-size:2.5rem"></i>
          <h4 class="fw-bold mt-2">Criar conta</h4>
          <p class="text-muted small">Comece a gerar contratos agora</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome completo</label>
            <input type="text" name="name" class="form-control" placeholder="João Silva" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirmar senha</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Repita a senha" required>
          </div>
          <button type="submit" class="btn btn-accent w-100">
            <i class="bi bi-person-check me-1"></i>Cadastrar
          </button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Já tem conta?
          <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
