{% extends "base.html" %}
{% block title %}Editar cliente — Contract Generator{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('clients.listar') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h3 class="fw-bold mb-0">Editar cliente</h3>
</div>

<form method="POST" action="{{ url_for('clients.editar', client_id=cliente.id) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-header section-secondary fw-semibold">
      <i class="bi bi-person me-2"></i>Dados do cliente
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Nome completo / Razão social <span class="text-danger">*</span></label>
          <input type="text" name="nome" class="form-control"
                 value="{{ cliente.nome or '' }}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Tipo de documento <span class="text-danger">*</span></label>
          <select name="tipo_documento" class="form-select" required>
            <option value="CPF" {% if cliente.tipo_documento != 'CNPJ' %}selected{% endif %}>CPF</option>
            <option value="CNPJ" {% if cliente.tipo_documento == 'CNPJ' %}selected{% endif %}>CNPJ</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Documento <span class="text-danger">*</span></label>
          <input type="text" name="documento" class="form-control"
                 placeholder="Somente números"
                 value="{{ cliente.documento or '' }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">E-mail</label>
          <input type="email" name="email" class="form-control"
                 value="{{ cliente.email or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Telefone</label>
          <input type="text" name="telefone" class="form-control"
                 value="{{ cliente.telefone or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">CEP</label>
          <input type="text" name="cep" class="form-control" placeholder="00000-000"
                 value="{{ cliente.cep or '' }}">
        </div>
        <div class="col-md-5">
          <label class="form-label fw-semibold">Logradouro</label>
          <input type="text" name="logradouro" class="form-control"
                 value="{{ cliente.logradouro or '' }}">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">Número</label>
          <input type="text" name="numero" class="form-control"
                 value="{{ cliente.numero or '' }}">
        </div>
        <div class="col-md-5">
          <label class="form-label fw-semibold">Complemento</label>
          <input type="text" name="complemento" class="form-control"
                 value="{{ cliente.complemento or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Bairro</label>
          <input type="text" name="bairro" class="form-control"
                 value="{{ cliente.bairro or '' }}">
        </div>
        <div class="col-md-5">
          <label class="form-label fw-semibold">Cidade</label>
          <input type="text" name="cidade" class="form-control"
                 value="{{ cliente.cidade or '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Estado</label>
          <input type="text" name="estado" class="form-control" maxlength="2"
                 placeholder="SC" value="{{ cliente.estado or '' }}">
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 justify-content-end mb-4">
    <a href="{{ url_for('clients.listar') }}" class="btn btn-outline-primary">Cancelar</a>
    <button type="submit" class="btn btn-accent px-4">
      <i class="bi bi-check-lg me-1"></i>Salvar cliente
    </button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/cep.js') }}"></script>
{% endblock %}
