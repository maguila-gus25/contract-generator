{% extends "base.html" %}
{% block title %}Login — Contract Generator{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-file-earmark-lock2 text-primary" style="font-size:2.5rem"></i>
          <h4 class="fw-bold mt-2">Entrar na conta</h4>
          <p class="text-muted small">Acesse seus contratos</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">E-mail</label>
            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <input type="password" name="password" class="form-control" placeholder="••••••" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" name="remember" class="form-check-input" id="remember">
            <label class="form-check-label text-muted small" for="remember">Lembrar-me</label>
          </div>
          <button type="submit" class="btn btn-accent w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
          </button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Não tem conta?
          <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Cadastre-se</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
