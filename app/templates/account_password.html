{% extends "base.html" %}
{% block title %}Trocar Senha — Contract Generator{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="{{ url_for('auth.account') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="fw-bold mb-0">Trocar senha</h3>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Senha atual</label>
            <input type="password" name="current_password" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Nova senha</label>
            <input type="password" name="new_password" class="form-control"
                   placeholder="Mínimo 8 caracteres, com letra e número" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Confirmar nova senha</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-accent w-100">
            <i class="bi bi-key me-1"></i>Atualizar senha
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
