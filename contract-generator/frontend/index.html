<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-item"><i data-lucide="file-text"></i> Contracts</a>
                <a href="#" class="nav-item"><i data-lucide="layout-template"></i> Templates</a>
                <a href="#" class="nav-item"><i data-lucide="users"></i> Clients</a>
                <a href="#" class="nav-item"><i data-lucide="history"></i> History</a>
                <a href="#" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <header class="header">
                <div class="header-title">
                    <h1>Contract Generator</h1>
                    <span class="badge">New Contract</span>
                </div>
                <div class="user-profile">
                    <button class="icon-btn"><i data-lucide="bell"></i><span class="notification-dot"></span></button>
                    <div class="avatar">AJ</div>
                    <span>A.J.</span>
                    <i data-lucide="chevron-down" class="small-icon"></i>
                </div>
            </header>

            <div class="content-grid">
                <!-- Form Area -->
                <div class="form-area">
                    <form id="contract-form">
                        <div class="cards-row">
                            <!-- Contractor Details -->
                            <div class="glass-card">
                                <h2>CONTRACTOR DETAILS</h2>
                                
                                <div class="form-group">
                                    <label>Type</label>
                                    <select id="contratante-type" required>
                                        <option value="CONTRATANTE">CONTRATANTE</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Document (CPF/CNPJ)</label>
                                    <div class="input-with-action">
                                        <input type="text" id="contratante-doc" placeholder="123.456.789-01" required>
                                        <button type="button" class="btn-small" onclick="buscarCnpj('contratante')">Search</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Contractor Name</label>
                                    <input type="text" id="contratante-name" placeholder="Alice Johnson" required>
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="contratante-email" placeholder="alice@example.com" required>
                                </div>
                                <div class="form-group">
                                    <label>CEP/Zip Code</label>
                                    <div class="input-with-action">
                                        <input type="text" id="contratante-cep" placeholder="90210-000" required>
                                        <button type="button" class="btn-small" onclick="buscarCep('contratante')">Search</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Address</label>
                                    <input type="text" id="contratante-address" placeholder="123 Innovation Drive" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group half">
                                        <label>Number</label>
                                        <input type="text" id="contratante-num" placeholder="100" required>
                                    </div>
                                    <div class="form-group half">
                                        <label>Complement</label>
                                        <input type="text" id="contratante-comp" placeholder="Apt 2">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group half">
                                        <label>Neighborhood</label>
                                        <input type="text" id="contratante-bairro" placeholder="Downtown" required>
                                    </div>
                                    <div class="form-group half">
                                        <label>City/State</label>
                                        <input type="text" id="contratante-city" placeholder="Los Angeles, CA" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Contractee Details -->
                            <div class="glass-card">
                                <h2>CONTRACTEE DETAILS</h2>
                                
                                <div class="form-group">
                                    <label>Type</label>
                                    <select id="contratado-type" required>
                                        <option value="CONTRATADA">CONTRATADA</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Document (CPF/CNPJ)</label>
                                    <div class="input-with-action">
                                        <input type="text" id="contratado-doc" placeholder="12.345.678/0001-90" required>
                                        <button type="button" class="btn-small" onclick="buscarCnpj('contratado')">Search</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Client Name</label>
                                    <input type="text" id="contratado-name" placeholder="TechCorp Solutions Inc." required>
                                </div>
                                <div class="form-group">
                                    <label>Email</label>
                                    <input type="email" id="contratado-email" placeholder="contact@techcorp.com" required>
                                </div>
                                <div class="form-group">
                                    <label>CEP/Zip Code</label>
                                    <div class="input-with-action">
                                        <input type="text" id="contratado-cep" placeholder="90210-000" required>
                                        <button type="button" class="btn-small" onclick="buscarCep('contratado')">Search</button>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Address</label>
                                    <input type="text" id="contratado-address" placeholder="456 Tech Boulevard" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group half">
                                        <label>Number</label>
                                        <input type="text" id="contratado-num" placeholder="200" required>
                                    </div>
                                    <div class="form-group half">
                                        <label>Complement</label>
                                        <input type="text" id="contratado-comp" placeholder="Suite 100">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group half">
                                        <label>Neighborhood</label>
                                        <input type="text" id="contratado-bairro" placeholder="Silicon Valley" required>
                                    </div>
                                    <div class="form-group half">
                                        <label>City/State</label>
                                        <input type="text" id="contratado-city" placeholder="San Francisco, CA" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Contract Info -->
                        <div class="glass-card wide-card">
                            <h2>CONTRACT INFORMATION</h2>
                            <div class="form-row-multi">
                                <div class="form-group">
                                    <label>Contract Title</label>
                                    <input type="text" id="contract-title" value="CONTRATO DE PRESTAÇÃO DE SERVIÇOS" required>
                                </div>
                                <div class="form-group">
                                    <label>Contract Value</label>
                                    <div class="input-with-icon">
                                        <span class="currency">R$</span>
                                        <input type="number" id="contract-value" placeholder="15000.00" required step="0.01">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Payment Method</label>
                                    <select id="contract-payment" required>
                                        <option value="Transferência Bancária (PIX)">Transferência Bancária (PIX)</option>
                                        <option value="Boleto">Boleto Bancário</option>
                                        <option value="Cartão de Crédito">Cartão de Crédito</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Type</label>
                                    <select id="contract-type" required>
                                        <option value="servico">Service Agreement</option>
                                        <option value="locacao">Locação</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Preview Area -->
                <div class="preview-area glass-card">
                    <h2>LIVE DOCUMENT PREVIEW</h2>
                    <div class="document-preview">
                        <div class="doc-header">
                            <h3 id="preview-title">SERVICE AGREEMENT - TechCorp Solutions Inc.</h3>
                        </div>
                        <div class="doc-body">
                            <p class="skeleton-text"></p>
                            <p class="skeleton-text short"></p>
                            
                            <h4>CLAUSES</h4>
                            <p class="skeleton-text"></p>
                            <p class="skeleton-text"></p>
                            <p class="skeleton-text"></p>
                            
                            <div class="signatures">
                                <div class="sig-box">
                                    <div class="line"></div>
                                    <span id="preview-contractor">Contractor</span>
                                </div>
                                <div class="sig-box">
                                    <div class="line"></div>
                                    <span id="preview-contractee">Contractee</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="button" class="btn btn-primary" onclick="gerarContrato('pdf')">
                            <i data-lucide="file-text"></i> Generate PDF
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="gerarContrato('docx')">
                            <i data-lucide="file-word"></i> Generate DOCX
                        </button>
                    </div>
                    
                    <!-- Loading / Success Status -->
                    <div id="status-message" class="status-message hidden">
                        <i data-lucide="loader-2" class="spin"></i> Generating...
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
